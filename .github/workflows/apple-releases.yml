name: Apple macOS release watch

# 매일 Apple Developer Releases RSS를 확인해 기준선에 없는 macOS 빌드(정식/RC/베타)가
# 나타나면 실패한다. 실패 = 메인테이너가 확인할 새 빌드가 있다는 뜻이다.
# 종료 코드: 1 새 빌드 / 2 피드 비었거나 깨짐 / 3 가져오기 실패

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: apple-releases
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 스크립트 단위 테스트 (오프라인 픽스처)
        run: python3 -I scripts/tests/test_check_apple_releases.py

      - name: Apple 릴리스 피드 확인
        run: python3 -I scripts/check-apple-releases.py
